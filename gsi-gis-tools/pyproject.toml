[project]
name = "gsi-gis-tools"
version = "0.1.0"
description = "国土地理院 基盤地図情報 (DEM / ベクターデータ) 変換・結合 GUI ツール群"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "rasterio>=1.3.0",
    "pyshp>=2.3.0",
    "pyproj>=3.5.0",
    "shapely>=2.0.0",
]

[project.scripts]
gsi-dem-converter = "gsi_dem_converter:main"
gsi-road-merger = "gsi_road_building_merger:main"

[tool.hatch.build.targets.wheel]
include = [
    "gsi_dem_converter.py",
    "gsi_road_building_merger.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

